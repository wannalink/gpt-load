# fly.toml app configuration file generated for gpt-load2 on 2026-05-16T17:08:54+03:01
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gpt-load2'
primary_region = 'arn'

[build]
  dockerfile = "Dockerfile.fly"

[env]
  DATA_DIR = '/app/data'
  HOST = '0.0.0.0'
  PORT = '3001'
  GOMEMLIMIT = '150MiB'
  GOGC = '60'
  SYNTHETIC_MODELS = '''
  [
    {
      "name": "gemini-flash-auto-best",
      "description": "Auto-selecting Gemini Flash model with priority fallback",
      "target_models": ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.5-flash", "gemini-3.6-flash"]
    },
    {
      "name": "gemini-flash-auto-worst",
      "description": "Gemini Flash models in reverse priority order",
      "target_models": ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.7-flash", "gemini-3.8-flash", "gemini-flash-latest"]
    },
    {
      "name": "gemini-flash-auto-frontier",
      "description": "Gemini Flash frontier tier models",
      "target_models": ["gemini-flash-latest", "gemini-3.8-flash", "gemini-3.7-flash"]
    },
    {
      "name": "gemini-flash-auto-mid",
      "description": "Gemini Flash mid tier models",
      "target_models": ["gemini-3.7-flash", "gemini-3.5-flash", "gemini-3.6-flash", "gemini-3.8-flash", "gemini-flash-latest"]
    },
    {
      "name": "gemini-flash-auto-low",
      "description": "Gemini Flash low tier models",
      "target_models": ["gemini-3.6-flash", "gemini-flash-lite-latest", "gemini-3.5-flash", "gemini-3.7-flash", "gemini-flash-latest", "gemini-3.8-flash"]
    }
  ]
  '''

[[mounts]]
  source = 'gpt_storage'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
  swap_size_mb = 512
