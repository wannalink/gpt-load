# fly.toml app configuration file generated for gpt-load2 on 2026-05-16T17:08:54+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gpt-load2'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = '/app/data'
  HOST = '0.0.0.0'
  PORT = '3001'

[[mounts]]
  source = 'gpt_storage'
  destination = '/app/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
