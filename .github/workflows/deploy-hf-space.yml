name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'screenshot/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      space_repo:
        description: 'Hugging Face Space repository (defaults to wannalink/gpt-load)'
        required: false
        default: 'wannalink/gpt-load'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face CLI
        run: |
          pip install --upgrade "huggingface_hub[cli]"

      - name: Build pure-Go Linux amd64 binary
        run: |
          VERSION="$(git describe --tags --always 2>/dev/null || echo '2.0.0-dev')"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags "-s -w -X gpt-load/internal/platform/version.Version=${VERSION}" \
            -o gpt-load .

      - name: Deploy Binary to Storage Bucket & Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_REPO: ${{ inputs.space_repo || vars.HF_SPACE_REPO || 'wannalink/gpt-load' }}
          BUCKET_NAME: 'wannalink/gpt-load-storage'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set. Please add HF_TOKEN under GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "==> Uploading compiled gpt-load binary to bucket: $BUCKET_NAME..."
          hf buckets cp gpt-load "hf://buckets/${BUCKET_NAME}/gpt-load" --token "$HF_TOKEN"

          echo "==> Staging clean Git tree for Hugging Face Space..."
          TMP_INDEX=$(mktemp)
          GIT_INDEX_FILE="$TMP_INDEX" git read-tree HEAD
          GIT_INDEX_FILE="$TMP_INDEX" git rm -r --cached --ignore-unmatch screenshot web >/dev/null 2>&1
          TREE_ID=$(GIT_INDEX_FILE="$TMP_INDEX" git write-tree)
          rm -f "$TMP_INDEX"

          MSG=$(git log -1 --format=%s)
          COMMIT_ID=$(git commit-tree "$TREE_ID" -m "Deploy to Hugging Face Space: $MSG")

          echo "==> Pushing clean commit to Hugging Face Space: $SPACE_REPO..."
          git push "https://oauth:${HF_TOKEN}@huggingface.co/spaces/${SPACE_REPO}" "${COMMIT_ID}:refs/heads/main" --force --no-verify

          echo "==> Successfully deployed to https://huggingface.co/spaces/${SPACE_REPO}"
